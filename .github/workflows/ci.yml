name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@6cf64d17c08dfc75392c55784b872fe9a6056553 # v0.6.57
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
      python-version: '3.12.15'
      uv-version: '0.13.5'
      setup: true
      fetch-depth: 0
